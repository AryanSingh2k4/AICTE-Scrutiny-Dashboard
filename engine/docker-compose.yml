services:
  scrutinix-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scrutinix-forensic-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    security_opt:
      - no-new-privileges:true
    environment:
      - PYTHONUNBUFFERED=1
      - TESSDATA_PREFIX=/usr/share/tesseract-ocr/5/tessdata/
      - ENGINE_API_KEY=${ENGINE_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
        reservations:
          memory: 512M
